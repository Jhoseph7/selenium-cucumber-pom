name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar los tests
        run: mvn -B clean test
        env:
          HEADLESS: "true"
          USUARIO_VALIDO: ${{ secrets.USUARIO_VALIDO }}
          CONTRASENA_VALIDA: ${{ secrets.CONTRASENA_VALIDA }}

      - name: Guardar resultados de Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Guardar reporte HTML de Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-report.html