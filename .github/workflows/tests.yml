name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar los tests
        run: mvn -B clean test
        env:
          HEADLESS: "true"
          USUARIO_VALIDO: ${{ secrets.USUARIO_VALIDO }}
          CONTRASENA_VALIDA: ${{ secrets.CONTRASENA_VALIDA }}

      - name: Guardar resultados de Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: target/allure-results

      - name: Guardar reporte HTML de Cucumber
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: target/cucumber-report.html

      - name: Preparar Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Instalar Allure
        if: ${{ !cancelled() }}
        run: npm install -g allure

      - name: Generar el reporte de Allure
        if: ${{ !cancelled() }}
        run: allure generate target/allure-results -o allure-report --clean

      - name: Preparar la página del reporte
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  publicar:
    needs: tests
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5